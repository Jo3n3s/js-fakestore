<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fakestore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class="flex items-center justify-between px-15 py-4 bg-orange-500">
        <div>
            <input type="text" placeholder="Digite o nome do produto" class="w-120 h-10 rounded bg-white pl-4" />
        </div>
        <div>
            <select id="categorias" class="h-10 rounded bg-white px-4">
                <option>Men's clothing</option>
                <option>Women's clothing</option>
                <option>Electronics</option>
                <option>Jewelery</option>
            </select>
            <select id="ordenacao" class="h-10 rounded bg-white px-4">
                <option value="preco">Ordenar por Preço</option>
                <option value="nota">Ordenar por Avaliação</option>

            </select>
        </div>

    </header>

    <main class="p-15 bg-slate-200">
        <div id="cards" class="grid grid-cols-4 gap-4">
            
        </div>

    </main>



    <script src="index.js"></script>
</body >
</html >
